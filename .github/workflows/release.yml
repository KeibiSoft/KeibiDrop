name: Release

# Tag convention (beta only for now):
#   v0.2.0-beta.1  → Beta prerelease
#   v0.2.0         → When ready for stable
#
# Usage: git tag v0.2.0-beta.1 && git push origin v0.2.0-beta.1

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-15
            name: macOS-arm64
            goos: darwin
            goarch: arm64
            package: dmg
          - os: macos-15
            name: macOS-x86_64
            goos: darwin
            goarch: amd64
            package: tar
            cross: true
          - os: ubuntu-22.04
            name: Linux-x86_64
            goos: linux
            goarch: amd64
            package: deb
          - os: windows-2022
            name: Windows-x86_64
            goos: windows
            goarch: amd64
            package: zip

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set version from tag
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          COMMIT=$(git rev-parse --short HEAD)
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "commit=$COMMIT" >> $GITHUB_OUTPUT

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            rust/target
            ~/.cargo/registry
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/Cargo.lock') }}

      - name: Install FUSE dev headers and protoc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libfuse-dev libfuse3-dev protobuf-compiler

      - name: Install macFUSE and protoc (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -L -o /tmp/macfuse.dmg "https://github.com/macfuse/macfuse/releases/download/macfuse-5.1.3/macfuse-5.1.3.dmg"
          hdiutil attach /tmp/macfuse.dmg -nobrowse -quiet
          sudo installer -pkg "/Volumes/macFUSE/Install macFUSE.pkg" -target /
          hdiutil detach "/Volumes/macFUSE" -quiet
          brew install protobuf

      - name: Install WinFsp and protoc (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install winfsp protoc innosetup zip -y
          $winfspDir = "C:\Program Files (x86)\WinFsp"
          echo "CPATH=$winfspDir\inc\fuse" >> $env:GITHUB_ENV
          echo "CGO_LDFLAGS=-L$winfspDir\lib" >> $env:GITHUB_ENV

      - name: Install protoc Go plugins
        shell: bash
        run: make install-proto

      - name: Install nfpm (Linux)
        if: runner.os == 'Linux'
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Add Rust cross-compile target (macOS x86_64 from arm64)
        if: matrix.cross == true
        run: rustup target add x86_64-apple-darwin

      - name: Build Rust UI
        if: runner.os != 'Windows' && matrix.cross != true
        run: make build-rust

      - name: Set cross-compile env (macOS x86_64 from arm64)
        if: matrix.cross == true && runner.os == 'macOS'
        run: |
          echo "CGO_ENABLED=1" >> $GITHUB_ENV
          echo "CGO_CFLAGS=-arch x86_64" >> $GITHUB_ENV
          echo "CGO_LDFLAGS=-arch x86_64" >> $GITHUB_ENV

      - name: Build Rust UI (cross-compile x86_64)
        if: matrix.cross == true && runner.os == 'macOS'
        run: |
          GOARCH=amd64 go build -buildmode=c-archive -o libkeibidrop.a ./rustbridge
          cd rust && cargo build --release --target x86_64-apple-darwin
          mkdir -p target/release
          cp target/x86_64-apple-darwin/release/keibidrop-rust target/release/keibidrop-rust

      - name: Build CLI and kd
        shell: bash
        run: |
          VERSION=${{ steps.version.outputs.version }}
          COMMIT=${{ steps.version.outputs.commit }}
          GOARCH=${{ matrix.goarch }} make build-cli build-kd VERSION=$VERSION COMMIT=$COMMIT

      - name: Import signing certificate (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/cert.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          echo "$APPLE_CERTIFICATE_P12" | base64 -d > "$CERT_PATH"
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

      - name: Sign binaries (macOS)
        if: runner.os == 'macOS'
        run: |
          IDENTITY="Developer ID Application: KEIBISOFT S.R.L. (74WXJSBRUQ)"
          for bin in keibidrop-cli kd; do
            if [ -f "$bin" ]; then
              codesign --force --options runtime --sign "$IDENTITY" --timestamp "./$bin"
            fi
          done
          if [ -f "rust/target/release/keibidrop-rust" ]; then
            codesign --force --options runtime --sign "$IDENTITY" --timestamp "rust/target/release/keibidrop-rust"
          fi

      - name: Package .dmg (macOS arm64)
        if: matrix.package == 'dmg'
        run: |
          make package-macos VERSION=${{ steps.version.outputs.version }} GOARCH=${{ matrix.goarch }} CODESIGN_IDENTITY="Developer ID Application: KEIBISOFT S.R.L. (74WXJSBRUQ)"

      - name: Package .tar.gz
        if: matrix.package != 'zip'
        shell: bash
        run: make package-tar VERSION=${{ steps.version.outputs.version }} GOARCH=${{ matrix.goarch }}

      - name: Package .zip (Windows)
        if: matrix.package == 'zip'
        shell: bash
        run: make package-windows VERSION=${{ steps.version.outputs.version }}

      - name: Package .deb (Linux)
        if: matrix.package == 'deb'
        run: make package-deb VERSION=${{ steps.version.outputs.version }}

      - name: Package and push Chocolatey (Windows)
        if: matrix.package == 'zip'
        shell: bash
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
        run: |
          SHA256=$(sha256sum dist/keibidrop-${{ steps.version.outputs.version }}-windows-amd64.zip | cut -d' ' -f1)
          make package-choco VERSION=${{ steps.version.outputs.version }} SHA256=$SHA256
          if [ -n "$CHOCO_API_KEY" ]; then
            choco push dist/*.nupkg --source https://push.chocolatey.org/ --api-key "$CHOCO_API_KEY"
          else
            echo "CHOCO_API_KEY not set, skipping push"
          fi

      - name: Notarize (macOS)
        if: runner.os == 'macOS' && matrix.package == 'dmg'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          for pkg in dist/*.dmg; do
            [ -f "$pkg" ] || continue
            ZIP_PATH="${pkg}.zip"
            zip -j "$ZIP_PATH" "$pkg"
            xcrun notarytool submit "$ZIP_PATH" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD" \
              --wait --timeout 10m
            xcrun stapler staple "$pkg"
            rm -f "$ZIP_PATH"
          done

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect release files and generate checksums
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.dmg" -o -name "*.deb" -o -name "*.tar.gz" -o -name "*.zip" -o -name "*-setup.exe" \) -exec cp {} release/ \;
          ls -lh release/
          cd release && sha256sum * > SHA256SUMS 2>/dev/null || shasum -a 256 * > SHA256SUMS

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"

          # Create release if it doesn't exist yet
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            PRERELEASE=""
            TITLE="KeibiDrop $TAG"
            if [[ "$TAG" == *"-"* ]] || [[ "$TAG" == v0.* ]]; then
              PRERELEASE="--prerelease"
              TITLE="KeibiDrop $TAG (Beta)"
            fi
            gh release create "$TAG" --title "$TITLE" --generate-notes $PRERELEASE
          fi

          # Upload artifacts
          gh release upload "$TAG" release/* --clobber

# Builds the Chocolatey package for a published release and pushes it to
# community.chocolatey.org. The release workflow calls it once the release
# is up. Run it by hand when moderation asks for a repush of the same
# version, or when a release run did not reach the push:
#
#   gh workflow run chocolatey.yml -f tag=v0.4.6
#
# The package downloads the Windows zip from the GitHub release and carries
# that zip's checksum, so both come from the release here, never from a
# build artifact, and the download address is checked before the push.
#
# Three things are checked before anything reaches the feed: the download
# address answers, the checksum matches the released zip, and the iconUrl is
# pinned to this version's tag on jsdelivr. The last one exists because a
# release tagged before a packaging fix builds from the tag's tree and ships
# the old metadata; the repush above is the cure and this check is the alarm.
name: Chocolatey

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, with the v prefix (v0.4.6)
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      CHOCO_API_KEY:
        required: true

permissions:
  contents: read

jobs:
  push:
    runs-on: windows-latest
    name: Push Chocolatey
    steps:
      - uses: actions/checkout@v7

      - name: Build the package from the released zip
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "::error::the tag must carry the v prefix, got '$TAG'"; exit 1 ;;
          esac
          SEMVER="${TAG#v}"
          command -v make >/dev/null || choco install make -y
          mkdir -p dist
          ZIP="dist/keibidrop-$SEMVER-windows-amd64.zip"
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "keibidrop-$SEMVER-windows-amd64.zip" -D dist
          ls -l dist
          # The checksum is computed here and handed to make: the Makefile's own
          # shasum step returns nothing on the Windows runner.
          SHA256=$(sha256sum "$ZIP" | cut -d' ' -f1)
          make package-choco VERSION="$SEMVER" GOARCH=amd64 SHA256="$SHA256"
          test -f "dist/keibidrop.$SEMVER.nupkg"
          echo "SEMVER=$SEMVER" >> "$GITHUB_ENV"

      - name: Check the download address and the checksum
        shell: bash
        run: |
          SCRIPT=dist/tools/chocolateyinstall.ps1
          URL=$(grep -o 'https://[^"]*windows-amd64\.zip' "$SCRIPT")
          PACKED=$(grep -o "checksum64 *= *'[0-9a-f]*'" "$SCRIPT" | grep -o "[0-9a-f]\{64\}")
          RELEASED=$(sha256sum "dist/keibidrop-$SEMVER-windows-amd64.zip" | cut -d' ' -f1)
          echo "url:      $URL"
          echo "packaged: $PACKED"
          echo "released: $RELEASED"
          if ! curl -fsSL -o /dev/null -r 0-0 "$URL"; then
            echo "::error::the package downloads from $URL and that address does not answer"
            exit 1
          fi
          if [ -z "$PACKED" ] || [ "$RELEASED" != "$PACKED" ]; then
            echo "::error::the checksum in the package does not match the zip on the release"
            exit 1
          fi

      - name: Check the icon address
        shell: bash
        run: |
          # Moderation rejects an iconUrl on raw.githubusercontent.com and wants
          # it pinned to the release tag on jsdelivr. A package built from a tag
          # cut before that template change carries the old address and is only
          # caught two days later by a human, so it is checked here instead.
          NUSPEC=dist/keibidrop.nuspec
          # Plain BRE on both sides: \? is a GNU extension and is not portable.
          ICON=$(grep -o '<iconUrl>[^<]*</iconUrl>' "$NUSPEC" | sed -e 's|<iconUrl>||' -e 's|</iconUrl>||')
          WANT="https://cdn.jsdelivr.net/gh/$GITHUB_REPOSITORY@v$SEMVER/"
          echo "iconUrl: $ICON"
          case "$ICON" in
            *raw.githubusercontent.com*)
              echo "::error::iconUrl is on raw.githubusercontent.com, which moderation refuses: $ICON"
              echo "::error::the template is fixed on main; repush this version with: gh workflow run chocolatey.yml -f tag=v$SEMVER"
              exit 1 ;;
          esac
          case "$ICON" in
            "$WANT"*) ;;
            *)
              echo "::error::iconUrl must be pinned to this version's tag under $WANT"
              echo "::error::got $ICON"
              exit 1 ;;
          esac
          if ! curl -fsSL -o /dev/null "$ICON"; then
            echo "::error::the iconUrl does not answer: $ICON"
            exit 1
          fi

      - name: Push
        shell: bash
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
        run: |
          if [ -z "$CHOCO_API_KEY" ]; then
            echo "::error::CHOCO_API_KEY is not set"
            exit 1
          fi
          choco push "dist/keibidrop.$SEMVER.nupkg" --source https://push.chocolatey.org/ --api-key "$CHOCO_API_KEY"

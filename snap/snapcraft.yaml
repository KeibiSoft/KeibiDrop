name: keibidrop
base: core22
version: '0.5.1'
title: KEIBIDROP
summary: Open another computer's folder as if it were local, end-to-end encrypted
description: |
  KEIBIDROP opens a folder on another computer over the internet as if it were
  a folder on your own computer. This mode is called Teleport: each file
  streams when an application opens it, so you work on a large folder without
  waiting for an upload or a download.

  KEIBIDROP also sends files between two devices with no account and no file
  size limit, and a dropped connection resumes where it stopped. The other
  person can use the app on Windows, macOS, Linux or Android, or join from a
  browser at https://web.keibidrop.com.

  Every connection is end-to-end encrypted with a post-quantum key exchange
  (X25519 and ML-KEM-1024).

  The snap sends and receives files. Teleport, the folder, needs the .deb or
  the apt package from https://keibidrop.com/install.html: a snap cannot show
  a FUSE mount to the other applications on the computer.

  Commands: keibidrop (the desktop app), keibidrop.kd (the agent CLI),
  keibidrop.keibidrop-cli (the interactive CLI) and keibidrop.kdmcp (the MCP
  server).
license: AGPL-3.0-only
website: https://keibidrop.com
source-code: https://github.com/KeibiSoft/KeibiDrop
issues: https://github.com/KeibiSoft/KeibiDrop/issues
icon: assets/icons/icon-256.png

grade: stable
# Strict: the store grants classic only to compilers, IDEs, shells and the
# like (reviewing-classic-confinement-snaps, "Supported"), and a FUSE mount
# made inside a strict snap stays in the snap's mount namespace. So the snap
# has no Teleport: the base holds no libfuse, the app finds none and starts
# in normal mode by itself. The folder ships in the .deb and the apt package.
confinement: strict

architectures:
  - build-on: amd64

apps:
  keibidrop:
    command: bin/keibidrop
    # gnome brings the GL, Wayland, X11, GTK dialog, D-Bus and font libraries
    # the desktop binary links, from the platform snap.
    extensions: [gnome]
    plugs: [network, network-bind, home, removable-media]
  keibidrop-cli:
    command: bin/keibidrop-cli
    plugs: [network, network-bind, home, removable-media]
  kd:
    command: bin/kd
    plugs: [network, network-bind, home, removable-media]
  kdmcp:
    command: bin/kdmcp
    plugs: [network, network-bind, home, removable-media]

parts:
  keibidrop:
    plugin: dump
    source: https://github.com/KeibiSoft/KeibiDrop/releases/download/v${SNAPCRAFT_PROJECT_VERSION}/keibidrop-${SNAPCRAFT_PROJECT_VERSION}-linux-amd64.tar.gz
    source-type: tar
    organize:
      keibidrop: bin/keibidrop
      keibidrop-cli: bin/keibidrop-cli
      kd: bin/kd
      kdmcp: bin/kdmcp
